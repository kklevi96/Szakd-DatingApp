<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <h1>DatingApp</h1>
      <p>Sign in to your account</p>
    </div>

    <form
      class="login-form"
      #loginForm="ngForm"
      (ngSubmit)="sendLoginCredentials(loginForm)"
    >

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input
          matInput
          type="email"
          name="email"
          [(ngModel)]="email"
          #emailField="ngModel"
          placeholder="name@example.com"
          autocomplete="username"
          required
          email
        />
        <mat-icon matSuffix>mail</mat-icon>
        @if (emailField.hasError('required')) {
          <mat-error>It is mandatory to fill the e-mail address</mat-error>
        } @else if (emailField.hasError('email')) {
          <mat-error>Enter a valid e-mail address</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input
          matInput
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>

      <button
        mat-raised-button
        type="submit"
        class="big-button"
        [disabled]="isLoading || loginForm.invalid"
      >
        {{ isLoading ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>
  </div>
</div>

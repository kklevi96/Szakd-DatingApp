<div class="invitation-toolbar">
  <button mat-icon-button type="button" aria-label="Create a meeting" title="Create a meeting" (click)="createMeeting()">
    <mat-icon>add</mat-icon>
  </button>
</div>
@if (errorMessage()) {
  <p role="alert">{{ errorMessage() }}</p>
  <button mat-button type="button" (click)="loadMeetings()">Try again</button>
}
@if (isLoading() && meetings().length === 0) {
  <p>Loading meetings...</p>
} @else {
  <div class="meeting-list">
    @for (meeting of meetings(); track meeting.id) {
      <app-meeting-card [meeting]="meeting" [showConversationLink]="false" (changed)="loadMeetings()">
      </app-meeting-card>
    } @empty {
      @if (!errorMessage()) { <p>No meetings for this conversation yet.</p> }
    }
  </div>
}

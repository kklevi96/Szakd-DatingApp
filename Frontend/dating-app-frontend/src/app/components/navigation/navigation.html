<mat-toolbar>
  <nav aria-label="Main navigation">
    @if (auth.isLoggedIn()) {
      <a
        mat-icon-button
        routerLink="/home"
        aria-label="Home"
        title="Home"
      >
        <mat-icon>home</mat-icon>
      </a>
    }

    <span class="example-spacer"></span>

    @if (auth.isLoggedIn()) {
      @if (auth.isAdmin()) {
        <a mat-button routerLink="/admin">
          <mat-icon>admin_panel_settings</mat-icon>
          Admin
        </a>
      } @else if (auth.currentUser()?.canRequestAdmin) {
        <a mat-button routerLink="/become-admin">
          <mat-icon>key</mat-icon>
          Become admin
        </a>
      }

      <a mat-button routerLink="/logout">
        <mat-icon>logout</mat-icon>
        Logout
      </a>
    } @else {
      <a mat-button routerLink="/login">
        <mat-icon>login</mat-icon>
        Login
      </a>

      <a mat-button routerLink="/register">
        <mat-icon>person_add</mat-icon>
        Register
      </a>
    }
  </nav>
</mat-toolbar>

@if (auth.isLoggedIn()) {
  <app-functions></app-functions>
}

<nav aria-label="Sections">
  <a routerLink="/dating" routerLinkActive="active-link"
     ariaCurrentWhenActive="page" aria-label="Dating" title="Dating">
    <mat-icon>favorite</mat-icon>
  </a>

  <a routerLink="/friends" routerLinkActive="active-link"
     ariaCurrentWhenActive="page" aria-label="Friends" title="Friends">
    <mat-icon>group</mat-icon>
  </a>

  <a routerLink="/conversations" routerLinkActive="active-link"
     ariaCurrentWhenActive="page" aria-label="Conversations" title="Conversations">
    <mat-icon
      aria-hidden="false"
      aria-label="Conversations"
      [matBadge]="unreadConversationCount()"
      [matBadgeHidden]="unreadConversationCount() === 0"
      [matBadgeDescription]="unreadConversationCount() + ' conversations with unread messages'">
      chat_bubble_outline
    </mat-icon>
  </a>

  <a routerLink="/meetings" routerLinkActive="active-link"
     ariaCurrentWhenActive="page" aria-label="Meetings" title="Meetings">
    <mat-icon>event</mat-icon>
  </a>
</nav>

<section class="admin-page">
  <h1>Admin</h1>

  @if (errorMessage()) {
    <p class="error-message" role="alert">{{ errorMessage() }}</p>
  } @else if (message()) {
    <p>{{ message() }}</p>
    <p>Signed in as {{ auth.currentUser()?.email }}</p>
  } @else {
    <p>Loading...</p>
  }

  @if (message()) {
    <button mat-stroked-button type="button" [disabled]="isRemovingAdmin()"
            (click)="removeAdmin()">
      {{ isRemovingAdmin() ? 'Removing admin access...' : 'Remove my admin access' }}
    </button>
    <p>You will be signed out after removing your admin access.</p>
  }
</section>
